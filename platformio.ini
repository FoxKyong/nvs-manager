; NVS Manager — PlatformIO project
;
; Environments:
;   cardputer  M5Stack Cardputer v1.0 / v1.1 and Cardputer ADV (one binary)
;   native     the same UI in an SDL window on a desktop, for UI work without hardware

[platformio]
default_envs = cardputer, native

[env]
build_flags =
    -DNVSM_VERSION='"1.0.0"'

[env:cardputer]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino
board = m5stack-stamps3
board_build.partitions = partitions.csv
monitor_speed = 115200
build_flags =
    ${env.build_flags}
    -DNVSM_PLATFORM_CARDPUTER=1
    -DNVSM_HAS_NVS=1
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; SdFat leaves `File` to FS.h (pulled in by M5GFX); the code uses FsFile only.
    -DDISABLE_FS_H_WARNING
    ; Keep the Arduino core from erasing NVS at boot (docs/RESEARCH.md, section 3).
    -Wl,--wrap=nvs_flash_init
    -Wl,--wrap=esp_partition_erase_range
lib_deps =
    m5stack/M5GFX @ 0.2.28
    m5stack/M5Unified @ 0.2.21
    m5stack/M5Cardputer @ 1.1.1
    ; FAT12/16/32 and exFAT cards; the framework's FatFs has exFAT compiled out.
    greiman/SdFat @ 2.3.1
; M5Cardputer declares IRremote for its examples only. The two local
; libraries exist for the desktop build and must not shadow the framework's
; own nvs_flash and ESP-IDF headers ("platforms": "native" alone did not keep
; them out).
lib_ignore =
    IRremote
    esp-idf-nvs
    idf-host-shim
build_src_filter =
    +<*>
    -<platform/native/>

[env:native]
platform = native
build_flags =
    ${env.build_flags}
    -DNVSM_PLATFORM_NATIVE=1
    -DNVSM_HAS_NVS=1
    -std=c++17
    -lSDL2
    -DM5GFX_BOARD=board_M5Cardputer
    -DM5GFX_SCALE=3
; ESP-IDF's nvs_flash (lib/esp-idf-nvs) runs over a RAM copy of a partition
; dump (lib/idf-host-shim); both libraries are native-only. Set NVSM_NVS_IMAGE
; to the dump file before starting the program.
lib_deps =
    m5stack/M5GFX @ 0.2.28
build_src_filter =
    +<*>
    -<platform/cardputer/>
    -<nvs/NvsBootGuard.cpp>
